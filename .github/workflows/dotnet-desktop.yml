name: Build and Release - CronTask

on:
  push:
    tags:
      - 'v*.*.*'  # dispara quando você cria uma tag v1.0.0, v1.0.1, etc.

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build project
      run: dotnet publish -c Release -r win-x64 --self-contained true -o ./publish
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/**/*
      env:
        GITHUB_TOKEN: ${{secrets.TOKEN_AUTOMATION_CRONTASK}}
